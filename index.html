<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lô Tô Chợ Lớn Quảng Ngãi 1 - Mừng Sinh Nhật Thứ 9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện hiệu ứng pháo hoa giấy Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.9)); }
    }
    .calling-anim {
      animation: pulseGlow 0.9s infinite ease-in-out;
    }
    .called {
      background: radial-gradient(circle, #f59e0b 0%, #b45309 100%) !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
      border-color: #fbbf24 !important;
    }
    @keyframes revealPop {
      0% { transform: scale(0.3); opacity: 0; }
      80% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .reveal-active {
      animation: revealPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .loto-cell {
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      border-radius: 0.75rem;
      background-color: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    /* Hiệu ứng nhấp nháy đèn neon toàn màn hình cho người trúng thưởng */
    @keyframes flashNeon {
      0%, 100% {
        color: #fde047;
        text-shadow: 0 0 20px #eab308, 0 0 50px #ef4444, 0 0 80px #dc2626;
        transform: scale(1);
      }
      50% {
        color: #ffffff;
        text-shadow: 0 0 30px #f43f5e, 0 0 70px #ec4899, 0 0 110px #f59e0b;
        transform: scale(1.04);
      }
    }
    .neon-blink {
      animation: flashNeon 0.65s infinite alternate ease-in-out;
    }

    @keyframes borderPulse {
      0%, 100% { border-color: rgba(234, 179, 8, 0.8); box-shadow: inset 0 0 30px rgba(234, 179, 8, 0.3), 0 0 50px rgba(234, 179, 8, 0.4); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: inset 0 0 45px rgba(239, 68, 68, 0.5), 0 0 80px rgba(239, 68, 68, 0.6); }
    }
    .modal-glow {
      animation: borderPulse 0.9s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-3 sm:p-5 select-none relative">

  <!-- MÀN HÌNH CHÚC MỪNG TOÀN MÀN HÌNH (POPUP OVERLAY) -->
  <div id="winnerOverlay" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6 cursor-pointer">
    <div class="max-w-4xl w-full bg-slate-900/95 border-4 border-amber-400 rounded-3xl p-8 sm:p-12 text-center modal-glow relative flex flex-col items-center">
      <span class="text-5xl sm:text-7xl mb-3">👑 🏆 🎊</span>
      
      <h2 class="text-3xl sm:text-5xl md:text-6xl font-black uppercase tracking-wider text-amber-400 neon-blink leading-tight mb-4">
        XIN CHÚC MỪNG NGƯỜI TRÚNG THƯỞNG!
      </h2>

      <p id="winnerSubDetails" class="text-xl sm:text-3xl font-extrabold text-white mt-2">
        Chúc mừng người chơi may mắn sở hữu con số trúng giải:
      </p>

      <div id="winnerNumberBadge" class="my-6 px-10 py-4 bg-gradient-to-r from-amber-500 via-rose-500 to-amber-500 text-slate-950 text-7xl sm:text-9xl font-black rounded-3xl shadow-2xl tracking-wider">
        --
      </div>

      <p class="text-sm sm:text-base text-slate-400 mt-2 italic">
        (Bấm chuột hoặc bấm phím bất kỳ để đóng màn hình chúc mừng)
      </p>
    </div>
  </div>

  <!-- POPUP CÀI ĐẶT 3 FILE NHẠC ĂN MỪNG -->
  <div id="settingsOverlay" class="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-black text-amber-400 uppercase flex items-center gap-2">
          ⚙️ Chọn File Nhạc Ăn Mừng
        </h3>
        <button id="btnCloseSettings" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <p class="text-xs text-slate-400 mb-4">
        Chọn 3 file âm thanh (.mp3, .wav) yêu thích từ máy tính để gán vào 3 nút ăn mừng:
      </p>

      <div class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nhạc Ăn Mừng 1 (Nút 1):</label>
          <input type="file" id="customVicFile1" accept="audio/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer bg-slate-950 rounded-lg p-1.5 border border-slate-800">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nhạc Ăn Mừng 2 (Nút 2):</label>
          <input type="file" id="customVicFile2" accept="audio/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-500 cursor-pointer bg-slate-950 rounded-lg p-1.5 border border-slate-800">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nhạc Ăn Mừng 3 (Nút 3):</label>
          <input type="file" id="customVicFile3" accept="audio/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer bg-slate-950 rounded-lg p-1.5 border border-slate-800">
        </div>
      </div>

      <div class="mt-6">
        <button id="btnSaveSettings" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm transition">
          Hoàn Tất & Áp Dụng
        </button>
      </div>
    </div>
  </div>

  <!-- CỘT LOGO TRÁI: DÀNH CHO MÁY TÍNH / TV (NỀN TRẮNG, SÁT MÉP) -->
  <aside class="hidden xl:flex fixed left-4 top-20 bottom-4 w-52 flex-col items-center justify-start gap-4 p-3 bg-slate-900/80 border-2 border-slate-800 rounded-3xl backdrop-blur-md z-30 shadow-2xl overflow-y-auto">
    <div class="w-full py-1.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center">
      <span class="text-xs font-black uppercase tracking-wider text-amber-400">ĐỒNG HÀNH</span>
    </div>
    
    <!-- Logo 1 (Đã nạp file anhnguyen.png) -->
    <div class="w-full h-36 bg-white rounded-2xl p-3 flex items-center justify-center border-2 border-slate-300 hover:border-amber-400 transition shadow-md">
      <img src="anhnguyen.png" alt="Nhà tài trợ 1" class="max-h-full max-w-full object-contain">
    </div>

    <!-- Logo 2 -->
    <div class="w-full h-36 bg-white rounded-2xl p-3 flex items-center justify-center border-2 border-slate-300 hover:border-amber-400 transition shadow-md">
      <img src="https://placehold.co/240x160/ffffff/f59e0b?text=LOGO+2" alt="Nhà tài trợ 2" class="max-h-full max-w-full object-contain">
    </div>

    <!-- Logo 3 -->
    <div class="w-full h-36
