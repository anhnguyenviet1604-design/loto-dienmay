<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lô Tô Chợ Lớn Quảng Ngãi 1 - Mừng Sinh Nhật Thứ 9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện hiệu ứng pháo hoa giấy Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.9)); }
    }
    .calling-anim {
      animation: pulseGlow 0.9s infinite ease-in-out;
    }
    .called {
      background: radial-gradient(circle, #f59e0b 0%, #b45309 100%) !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
      border-color: #fbbf24 !important;
    }
    @keyframes revealPop {
      0% { transform: scale(0.3); opacity: 0; }
      80% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .reveal-active {
      animation: revealPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .loto-cell {
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      border-radius: 0.75rem;
      background-color: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    /* Hiệu ứng nhấp nháy đèn neon toàn màn hình cho người trúng thưởng */
    @keyframes flashNeon {
      0%, 100% {
        color: #fde047;
        text-shadow: 0 0 20px #eab308, 0 0 50px #ef4444, 0 0 80px #dc2626;
        transform: scale(1);
      }
      50% {
        color: #ffffff;
        text-shadow: 0 0 30px #f43f5e, 0 0 70px #ec4899, 0 0 110px #f59e0b;
        transform: scale(1.04);
      }
    }
    .neon-blink {
      animation: flashNeon 0.65s infinite alternate ease-in-out;
    }

    @keyframes borderPulse {
      0%, 100% { border-color: rgba(234, 179, 8, 0.8); box-shadow: inset 0 0 30px rgba(234, 179, 8, 0.3), 0 0 50px rgba(234, 179, 8, 0.4); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: inset 0 0 45px rgba(239, 68, 68, 0.5), 0 0 80px rgba(239, 68, 68, 0.6); }
    }
    .modal-glow {
      animation: borderPulse 0.9s infinite ease-in-out;
    }

    /* Hiệu ứng chữ sinh nhật ánh kim rực rỡ */
    @keyframes goldShine {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.8)) drop-shadow(0 0 20px rgba(249, 115, 22, 0.6));
      }
      50% {
        filter: drop-shadow(0 0 16px rgba(253, 224, 71, 1)) drop-shadow(0 0 30px rgba(239, 68, 68, 0.9));
      }
    }
    .birthday-highlight {
      animation: goldShine 2s infinite ease-in-out;
    }
  </style>
</head>
